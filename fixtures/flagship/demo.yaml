autocast: 1
output:
  path: docs/flagship-demo.mp4
  canvas: [1280, 720]
  fps: 30

defaults:
  typing_speed: 55ms
  settle: 750ms

style:
  background: { gradient: ["#0f1020", "#1b1b33"], padding: 56 }
  window: { radius: 14, shadow: true }
  cursor: { size: 1.4 }

sessions:
  api:
    backend: terminal
    cols: 100
    rows: 24
  web:
    backend: browser
    viewport: [1280, 720]

scenes:
  - id: boot
    use: api
    narrate: "First we start the order API."
    steps:
      - type: "node fixtures/web-app/server.mjs 34700"
      - key: Enter
      - wait_for:
          stdout: /listening on :34700/
    assert:
      - process_alive: true
      - stdout_contains: "listening on :34700"

  - id: order
    use: web
    narrate: "A customer places an order for twenty-four units."
    steps:
      - goto: http://127.0.0.1:34700/
      - click: "[data-test=new-order]"
      - fill: { selector: "#qty", value: "24" }
      - click: "#submit"
      - wait_for:
          selector: ".order-confirmed"
    assert:
      - visible: ".order-confirmed"
      - no_console_errors: true

  - id: logs
    use: api
    narrate: "And the server logged it."
    layout:
      primary: web
      inset: { session: api, corner: bottom-right, scale: 0.4 }
    assert:
      - stdout_matches: /POST \/api\/orders 201/
